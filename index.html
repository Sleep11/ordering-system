<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>多人在线点餐系统</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- ========== 登录页面 ========== -->
  <div id="loginPage" class="page">
    <div class="login-container">
      <div class="login-brand">
        <div class="login-icon">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/>
            <path d="M7 2v20"/>
            <path d="M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/>
          </svg>
        </div>
        <h1>点餐系统</h1>
        <p class="subtitle">请使用您的账号登录</p>
      </div>
      <form id="loginForm">
        <div class="form-group">
          <label for="username">用户名</label>
          <input type="text" id="username" name="username" required autocomplete="username" placeholder="输入用户名">
        </div>
        <div class="form-group">
          <label for="password">密码</label>
          <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="输入密码">
        </div>
        <div class="remember-row">
          <label class="remember-label">
            <input type="checkbox" id="rememberMe" checked>
            <span class="toggle-track-lg"></span>
            <span class="toggle-text">记住密码，下次自动登录</span>
          </label>
        </div>
        <button type="submit" class="btn btn-primary btn-block">登录</button>
        <div id="loginError" class="error-message"></div>
      </form>
    </div>
  </div>

  <!-- ========== 主页面 ========== -->
  <div id="mainPage" class="page hidden">
    <!-- 顶部栏 -->
    <header class="topbar">
      <div class="topbar-inner">
        <div class="topbar-left">
          <button id="sidebarToggle" class="btn btn-icon topbar-menu-btn" title="切换侧边栏">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="3" y1="6" x2="21" y2="6"/>
              <line x1="3" y1="12" x2="21" y2="12"/>
              <line x1="3" y1="18" x2="21" y2="18"/>
            </svg>
          </button>
          <span class="topbar-title">多人在线点餐系统</span>
        </div>
        <div class="topbar-right">
          <span id="userName" class="topbar-user"></span>
          <span id="userRole" class="role-badge"></span>
          <button id="changePasswordBtn" class="btn btn-ghost btn-small">修改密码</button>
          <button id="logoutBtn" class="btn btn-ghost btn-small">退出</button>
        </div>
      </div>
    </header>

    <div class="layout">
      <!-- 侧边栏（仅管理员） -->
      <aside id="sidebar" class="sidebar hidden">
        <nav class="sidebar-nav">
          <a href="#section-order" class="sidebar-link active" data-section="order">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 2h6l3 7H6l3-7z"/>
              <path d="M12 9v13"/>
              <path d="M5 16h14"/>
            </svg>
            点餐登记
          </a>
          <a href="#section-stats" class="sidebar-link" data-section="stats">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="20" x2="18" y2="10"/>
              <line x1="12" y1="20" x2="12" y2="4"/>
              <line x1="6" y1="20" x2="6" y2="14"/>
            </svg>
            今日统计
          </a>
          <a href="#section-orders" class="sidebar-link" data-section="orders">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
              <line x1="16" y1="13" x2="8" y2="13"/>
              <line x1="16" y1="17" x2="8" y2="17"/>
            </svg>
            订单列表
          </a>
          <a href="#section-admin" class="sidebar-link" data-section="admin">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
              <circle cx="9" cy="7" r="4"/>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
            用户管理
          </a>
          <div class="sidebar-section-label">系统设置</div>
          <div class="sidebar-setting">
            <div class="sidebar-setting-info">
              <span class="sidebar-setting-label">禁止用户修改餐品</span>
              <span class="sidebar-setting-desc">锁定后普通用户不能修改/删除订单</span>
            </div>
            <label class="toggle-switch">
              <input type="checkbox" id="lockToggle">
              <span class="toggle-slider"></span>
            </label>
          </div>
          <div class="sidebar-section-label">点餐时段控制</div>
          <div class="sidebar-setting">
            <div class="sidebar-setting-info">
              <span class="sidebar-setting-label">🥡 禁止午餐点餐</span>
              <span class="sidebar-setting-desc">开启后普通用户不能提交午餐订单</span>
            </div>
            <label class="toggle-switch">
              <input type="checkbox" id="lunchLockToggle">
              <span class="toggle-slider"></span>
            </label>
          </div>
          <div class="sidebar-setting">
            <div class="sidebar-setting-info">
              <span class="sidebar-setting-label">🍽 禁止晚餐点餐</span>
              <span class="sidebar-setting-desc">开启后普通用户不能提交晚餐订单</span>
            </div>
            <label class="toggle-switch">
              <input type="checkbox" id="dinnerLockToggle">
              <span class="toggle-slider"></span>
            </label>
          </div>
        </nav>
      </aside>

      <!-- 主内容区 -->
      <main class="content" id="mainContent">
        <!-- 数据加载提示 -->
        <div id="dataLoadNotice" class="data-load-notice hidden"></div>

        <!-- 点餐登记 -->
        <section id="section-order" class="panel collapsible">
          <div class="panel__header collapsible-toggle" data-section="order">
            <h2 class="panel__title">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 2h6l3 7H6l3-7z"/>
                <path d="M12 9v13"/>
                <path d="M5 16h14"/>
              </svg>
              点餐登记
            </h2>
            <svg class="collapse-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"/>
            </svg>
          </div>
          <div class="panel__body collapsible-body">
            <form id="orderForm">
              <div class="form-row">
                <div class="form-group">
                  <label for="orderDate">日期</label>
                  <input type="date" id="orderDate" name="date" required max="">
                </div>
                <div class="form-group">
                  <label for="mealType">餐别</label>
                  <select id="mealType" name="mealType" required>
                    <option value="lunch">午餐</option>
                    <option value="dinner">晚餐</option>
                  </select>
                </div>
              </div>

              <!-- 管理员：批量订餐表格 -->
              <div class="form-group" id="userSelectGroup" style="display:none;">
                <label>订餐人员 <span class="selected-count" id="selectedUserCount">已选 0 人</span></label>
                <div class="batch-order-table" id="batchOrderTable">
                  <div class="batch-order-header">
                    <span class="col-checkbox"><input type="checkbox" id="selectAllUsers" title="全选/取消全选"></span>
                    <span class="col-name">姓名</span>
                    <span class="col-type">餐品类型</span>
                    <span class="col-dish">餐品名称</span>
                    <span class="col-price">价格(元)</span>
                  </div>
                  <div id="batchOrderRows"></div>
                </div>
              </div>

              <!-- 普通用户：单人点餐 -->
              <div class="form-group" id="singleItemTypeGroup">
                <label for="itemType">餐品类型</label>
                <select id="itemType" name="itemType" required>
                  <option value="blind">盲盒</option>
                  <option value="custom">自定义</option>
                </select>
              </div>
              <div class="form-group" id="customItemGroup" style="display:none;">
                <label for="itemName">餐品名称</label>
                <input type="text" id="itemName" name="itemName" placeholder="请输入餐品名称">
              </div>
              <div class="form-group" id="customPriceGroup" style="display:none;">
                <label for="itemPrice">价格（元）</label>
                <input type="number" id="itemPrice" name="price" step="0.01" min="0" placeholder="请输入价格">
              </div>
              <div class="form-group" id="blindPriceInfo">
                <p class="price-info">午餐盲盒：11元 | 晚餐盲盒：12元</p>
              </div>
              <div id="batchSubmitStatus" class="batch-submit-status hidden"></div>
              <button type="submit" class="btn btn-primary">提交订单</button>
            </form>
          </div>
        </section>

        <!-- 今日统计 -->
        <section id="section-stats" class="panel">
          <div class="panel__header">
            <h2 class="panel__title">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="20" x2="18" y2="10"/>
                <line x1="12" y1="20" x2="12" y2="4"/>
                <line x1="6" y1="20" x2="6" y2="14"/>
              </svg>
              今日统计
            </h2>
          </div>
          <div class="panel__body">
            <div class="metric-strip">
              <div class="metric-card">
                <div class="metric-value" id="totalOrders">0</div>
                <div class="metric-label">订单总数</div>
              </div>
              <div class="metric-card metric-card--success">
                <div class="metric-value" id="paidOrders">0</div>
                <div class="metric-label">已付款</div>
              </div>
              <div class="metric-card metric-card--danger">
                <div class="metric-value" id="unpaidOrders">0</div>
                <div class="metric-label">未付款</div>
              </div>
              <div class="metric-card">
                <div class="metric-value" id="totalAmount">¥0.00</div>
                <div class="metric-label">总金额</div>
              </div>
              <div class="metric-card metric-card--success">
                <div class="metric-value" id="paidAmount">¥0.00</div>
                <div class="metric-label">已付金额</div>
              </div>
              <div class="metric-card metric-card--danger">
                <div class="metric-value" id="unpaidAmount">¥0.00</div>
                <div class="metric-label">未付金额</div>
              </div>
            </div>
          </div>
        </section>

        <!-- 订单列表 -->
        <section id="section-orders" class="panel collapsible">
          <div class="panel__header collapsible-toggle" data-section="orders">
            <h2 class="panel__title">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                <polyline points="14 2 14 8 20 8"/>
              </svg>
              最近七天订单
            </h2>
            <svg class="collapse-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"/>
            </svg>
          </div>
          <div class="panel__body collapsible-body">
            <div id="ordersContainer"></div>
          </div>
        </section>

        <!-- 管理员：用户管理 -->
        <section id="section-admin" class="panel collapsible hidden">
          <div class="panel__header collapsible-toggle" data-section="admin">
            <h2 class="panel__title">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                <circle cx="9" cy="7" r="4"/>
              </svg>
              用户管理
            </h2>
            <svg class="collapse-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"/>
            </svg>
          </div>
          <div class="panel__body collapsible-body">
            <form id="addUserForm" class="form-inline">
              <div class="form-group">
                <label for="newUsername">用户名</label>
                <input type="text" id="newUsername" name="username" required placeholder="输入新用户名">
              </div>
              <div class="form-group">
                <label for="newUserRole">角色</label>
                <select id="newUserRole" name="role">
                  <option value="user">普通用户</option>
                  <option value="admin">管理员</option>
                </select>
              </div>
              <button type="submit" class="btn btn-primary">添加用户</button>
            </form>
            <div id="usersList" class="users-list"></div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <!-- ========== 修改密码弹窗 ========== -->
  <div id="passwordModal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal__header">
        <h3>修改密码</h3>
        <button class="btn btn-icon modal-close" id="cancelPasswordBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <form id="passwordForm">
        <div class="form-group">
          <label for="oldPassword">旧密码</label>
          <input type="password" id="oldPassword" name="oldPassword" required>
        </div>
        <div class="form-group">
          <label for="newPassword">新密码</label>
          <input type="password" id="newPassword" name="newPassword" required minlength="6">
        </div>
        <div class="form-group">
          <label for="confirmPassword">确认新密码</label>
          <input type="password" id="confirmPassword" name="confirmPassword" required minlength="6">
        </div>
        <div id="passwordError" class="error-message"></div>
        <div class="modal__actions">
          <button type="submit" class="btn btn-primary">确认修改</button>
          <button type="button" class="btn btn-secondary" id="cancelPasswordBtn2">取消</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ========== 编辑订单弹窗 ========== -->
  <div id="editOrderModal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal__header">
        <h3>修改餐品</h3>
        <button class="btn btn-icon modal-close" id="cancelEditBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <form id="editOrderForm">
        <div class="form-group">
          <label>订餐人</label>
          <p class="form-help" id="editPersonName"></p>
        </div>
        <div class="form-group">
          <label>日期</label>
          <p class="form-help" id="editOrderDate"></p>
        </div>
        <div class="form-group">
          <label for="editMealType">餐别</label>
          <select id="editMealType" name="editMealType" required>
            <option value="lunch">午餐</option>
            <option value="dinner">晚餐</option>
          </select>
        </div>
        <div class="form-group">
          <label for="editItemType">餐品类型</label>
          <select id="editItemType" name="editItemType" required>
            <option value="blind">盲盒</option>
            <option value="custom">自定义</option>
          </select>
        </div>
        <div class="form-group" id="editCustomItemGroup" style="display:none;">
          <label for="editItemName">餐品名称</label>
          <input type="text" id="editItemName" name="editItemName" placeholder="请输入餐品名称">
        </div>
        <div class="form-group" id="editCustomPriceGroup" style="display:none;">
          <label for="editItemPrice">价格（元）</label>
          <input type="number" id="editItemPrice" name="editItemPrice" step="0.01" min="0" placeholder="请输入价格">
        </div>
        <div class="form-group" id="editBlindPriceInfo">
          <p class="price-info">午餐盲盒：11元 | 晚餐盲盒：12元</p>
        </div>
        <div id="editOrderError" class="error-message"></div>
        <div class="modal__actions">
          <button type="submit" class="btn btn-primary">保存修改</button>
          <button type="button" class="btn btn-secondary" id="cancelEditBtn2">取消</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ========== Toast 通知 ========== -->
  <div id="toastContainer" class="toast-container"></div>

  <script src="app.js"></script>
</body>
</html>
