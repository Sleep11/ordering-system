name: Deploy to Retinbox Web Hosting

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.8.0
      - name: Deploy to Retinbox Web Hosting
        env:
          RTH_API_KEY: ${{ secrets.RTH_API_KEY }}
        run: deno -Ar https://host.retiehe.com/cli deploy
