name: Deploy to Retinbox
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.x"
      - name: Deploy
        env:
          RTH_API_KEY: ${{ secrets.RTH_API_KEY }}
        run: deno -Ar https://host.retiehe.com/cli deploy